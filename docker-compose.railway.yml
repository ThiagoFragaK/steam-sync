# Railway: worker + RabbitMQ. Postgres stays the shared AchievHub database.
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-steam}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  steam-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: ${{rabbitmq.RAILWAY_PRIVATE_DOMAIN}}
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER:-steam}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: /
      SyncWorker__Concurrency: "3"
      SyncWorker__NightlyCron: "0 0 * * *"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
