services:
  steam-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=host.docker.internal;Port=6110;Database=achievhub;Username=postgres;Password=postgres;SSL Mode=Disable}
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: ${RabbitMQ__Host:-host.docker.internal}
      RabbitMQ__Port: ${RabbitMQ__Port:-5672}
      RabbitMQ__Username: ${RabbitMQ__Username:-guest}
      RabbitMQ__Password: ${RabbitMQ__Password:-guest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
