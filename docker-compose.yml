services:
  steam-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-}
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: ${RabbitMQ__Host:-host.docker.internal}
      RabbitMQ__Port: ${RabbitMQ__Port:-5672}
      RabbitMQ__Username: ${RabbitMQ__Username:-}
      RabbitMQ__Password: ${RabbitMQ__Password:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
