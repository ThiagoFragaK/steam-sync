# Local stack for steam-sync worker development (uses shared achievhub DB).
# Prefer running the full stack from ../achiev-hub/docker-compose.yml.

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  steam-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=host.docker.internal;Port=6110;Database=achievhub;Username=postgres;Password=postgres;SSL Mode=Disable}
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      - rabbitmq
    deploy:
      replicas: 2
