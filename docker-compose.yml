# RabbitMQ + worker. Postgres comes from AchievHub via external network `hub`.
#
#   docker network create hub
#   cd ../achiev-hub && docker compose -p hub up -d
#   docker compose -p hub up --build

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - hub

  steam-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=postgres;Port=5432;Database=achievhub;Username=postgres;Password=postgres;SSL Mode=Disable}
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      - rabbitmq
    networks:
      - hub

networks:
  hub:
    external: true
    name: hub
